<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />

    <style>
      :root {
        color-scheme: light;
        --navy: #173e8c;
        --teal: #087f8c;
        --gold: #f2b441;
        --ink: #17243d;
        --muted: #5e6b82;
        --line: #dce4ef;
        --surface: #ffffff;
        --soft: #f2f6fb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0 18px 52px;
        background: var(--soft);
        color: var(--ink);
        font-family: Tahoma, "Segoe UI", Arial, sans-serif;
        line-height: 1.8;
      }
      .shell { max-width: 820px; margin: 0 auto; }
      header {
        margin: 0 -18px 28px;
        padding: 28px 18px 34px;
        background: linear-gradient(135deg, var(--navy), #286a9e 62%, var(--teal));
        color: #fff;
      }
      .header-inner { max-width: 820px; margin: 0 auto; }
      .brand { margin: 0 0 22px; font-size: 14px; font-weight: 700; opacity: .88; }
      .eyebrow { margin: 0 0 4px; color: #bdebef; font-size: 13px; font-weight: 700; }
      h1 { margin: 0; font-size: clamp(28px, 5vw, 42px); line-height: 1.25; }
      .updated { margin: 12px 0 0; color: #dcefff; font-size: 13px; }
      .intro {
        margin: 0 0 18px;
        padding: 20px 22px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        font-size: 17px;
        font-weight: 600;
      }
      .section {
        margin: 0 0 13px;
        padding: 20px 22px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
      }
      h2 {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.45;
      }
      h2::before {
        content: "";
        display: inline-block;
        width: 5px;
        height: 23px;
        border-radius: 5px;
        background: var(--gold);
        flex: 0 0 auto;
      }
      p { margin: 7px 0 0; color: var(--muted); font-size: 15px; }
      ul { margin: 8px 0 0; padding: 0 21px 0 0; color: var(--muted); }
      li { padding: 2px 0; font-size: 15px; }
      .section-label { margin: 10px 0 0; color: var(--ink); font-weight: 700; }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }
      nav a, .support {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 11px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
      }
      nav a { color: var(--navy); background: #e5edf9; }
      nav a[aria-current="page"] { color: #fff; background: var(--teal); }
      .support { margin-top: 18px; color: #fff; background: var(--navy); }
      footer { margin-top: 28px; color: var(--muted); font-size: 12px; text-align: center; }
      @media (min-width: 700px) {
        body { padding: 0 28px 68px; }
        header { margin-left: -28px; margin-right: -28px; padding-left: 28px; padding-right: 28px; }
      }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; --ink: #eaf1ff; --muted: #b4c0d4; --line: #2b3b56; --surface: #14213a; --soft: #0d1729; }
        nav a { color: #dce8ff; background: #203557; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <p class="brand">APP_NAME_PLACEHOLDER</p>
        <p class="eyebrow">LEGAL_EYEBROW_PLACEHOLDER</p>
        <h1>LEGAL_TITLE_PLACEHOLDER</h1>
        <p class="updated">LEGAL_UPDATED_PLACEHOLDER</p>
      </div>
    </header>
    <main class="shell">

      LEGAL_CONTENT_PLACEHOLDER
      <nav aria-label="الوثائق القانونية">

        <a href="TERMS_URL_PLACEHOLDER" TERMS_CURRENT_PLACEHOLDER>شروط الاستخدام</a>
      </nav>
      <p class="support">للاستفسارات، افتح مركز الدعم من داخل التطبيق</p>
      <footer>© APP_NAME_PLACEHOLDER — وثيقة معلومات عامة للاستخدام مع الخدمة</footer>
    </main>
  </body>
</html>
